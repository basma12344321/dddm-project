<div class="analyze-wrapper">
  <h2 class="page-title">Analyse de données métier</h2>

  <div style="height: 0.5px; background: #e9ecef; margin-bottom: 1.5rem;"></div>

  <!-- Sélection du domaine -->
  <div class="field-group">
    <label>Domaine métier</label>
    <mat-form-field appearance="outline" class="full-width">
      <mat-select [(value)]="selectedDomain" required>
        <mat-option *ngFor="let domain of domains" [value]="domain.value">
          {{ domain.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <!-- Tabs : CSV ou Ticker (finance uniquement) -->
  <div *ngIf="selectedDomain === 'finance'" class="mode-tabs">
    <button class="mode-tab" [class.active]="analysisMode === 'file'" (click)="analysisMode = 'file'">
      <mat-icon>upload_file</mat-icon> Fichier CSV
    </button>
    <button class="mode-tab" [class.active]="analysisMode === 'ticker'" (click)="analysisMode = 'ticker'">
      <mat-icon>search</mat-icon> Ticker en temps réel
    </button>
  </div>

  <!-- Mode Ticker -->
  <div *ngIf="selectedDomain === 'finance' && analysisMode === 'ticker'" class="ticker-section">
    <div class="field-group">
      <label>Symbole boursier</label>
      <div class="ticker-input-row">
        <div class="input-wrapper">
          <mat-icon class="input-icon">business</mat-icon>
          <input type="text" [(ngModel)]="tickerSymbol"
                 placeholder="Ex: AAPL, MSFT, GOOGL..."
                 (keyup.enter)="analyzeTicker()">
        </div>
        <button class="analyze-button ticker-btn"
                [disabled]="!tickerSymbol || isLoading"
                (click)="analyzeTicker()">
          <mat-spinner *ngIf="isLoading" diameter="18"></mat-spinner>
          <mat-icon *ngIf="!isLoading">trending_up</mat-icon>
          <span *ngIf="!isLoading">Analyser</span>
        </button>
      </div>
    </div>

    <div class="ticker-examples">
      <span class="examples-label">Exemples :</span>
      <span class="ticker-chip" *ngFor="let t of exampleTickers" (click)="tickerSymbol = t">{{ t }}</span>
    </div>
  </div>

  <!-- Mode Fichier CSV -->
  <div *ngIf="analysisMode === 'file' || selectedDomain === 'logistic'">
    <div class="file-upload-box"
         (click)="fileInput.click()"
         (dragover)="onDragOver($event)"
         (drop)="onFileDrop($event)">
      <input #fileInput type="file" hidden (change)="onFileSelected($event)">
      <mat-icon class="upload-icon">cloud_upload</mat-icon>
      <p>{{ fileName || 'Déposez votre fichier ici ou cliquez pour sélectionner' }}</p>
      <small *ngIf="file">{{ fileName }} sélectionné</small>
    </div>

    <button class="analyze-button"
            [disabled]="!isFormValid() || isLoading"
            (click)="analyze()">
      <mat-spinner *ngIf="isLoading" diameter="18"></mat-spinner>
      <mat-icon *ngIf="!isLoading">play_arrow</mat-icon>
      <span *ngIf="!isLoading">Lancer l'analyse</span>
    </button>
  </div>

  <!-- Feedback erreur -->
  <div *ngIf="error" class="error-message">
    <mat-icon>error_outline</mat-icon>
    {{ error }}
  </div>

</div>
